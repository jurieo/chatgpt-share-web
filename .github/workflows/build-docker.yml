name: Build and publish Docker image

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      tag:
        description: "The Docker image tag"
        required: false
        default: "latest"
        type: choice
        options:
          - latest
          - test
      platform:
        description: "The platform for the Docker image (amd64, arm64, both)"
        required: true
        default: "amd64"
        type: choice
        options:
          - amd64
          - arm64
          - both

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Dockerhub
        uses: docker/login-action@v2
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate tags
        id: generate-tags
        run: |
          now=$(TZ=Asia/Shanghai date +"%Y%m%d%H%M%S")
          echo -n "$now" > VERSION
          if [[ "${{ github.event.inputs.tag }}" == "test" ]] || [[ "${{ github.event_name }}" == "push" ]]; then
            echo "IMAGE_TAGS=${{ env.IMAGE_NAME }}:test" >> $GITHUB_ENV
          else
            echo "IMAGE_TAGS=${{ env.IMAGE_NAME }}:latest" >> $GITHUB_ENV
          fi
          content=$(cat VERSION)
          echo "Content of VERSION: $content"

      - name: Determine platforms
        run: |
          if [[ "${{ github.event.inputs.platform }}" == "both" ]]; then
            echo "PLATFORMS=linux/amd64,linux/arm64" >> $GITHUB_ENV
          elif [[ "${{ github.event.inputs.platform }}" == "amd64" ]]; then
            echo "PLATFORMS=linux/amd64" >> $GITHUB_ENV
          else
            echo "PLATFORMS=linux/arm64" >> $GITHUB_ENV
          fi

      - name: Build and push Docker images
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ env.IMAGE_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
